<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VAPT Lens">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c34"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#180f33"/>
    </linearGradient>
    <linearGradient id="vl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#b18cff"/>
    </linearGradient>
    <linearGradient id="vl-handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="vl-glass" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#1c506e"/>
      <stop offset="0.55" stop-color="#102238"/>
      <stop offset="1" stop-color="#080f1e"/>
    </radialGradient>
    <radialGradient id="vl-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge tile -->
  <rect width="64" height="64" rx="15" fill="url(#vl-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#7cc4ff" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M2 21C11 10 26 4 43 5 29 9 16 18 8 31 5 27 3 24 2 21Z" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Scan halo -->
  <circle cx="28" cy="28" r="17" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="6"/>
  <circle cx="28" cy="28" r="16.5" fill="none" stroke="#b18cff" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="15 12" transform="rotate(-35 28 28)"/>
  <circle cx="28" cy="28" r="16.5" fill="none" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="7 20" transform="rotate(50 28 28)"/>

  <!-- Handle -->
  <path d="M37 37 51 51" stroke="#070d19" stroke-width="10" stroke-linecap="round"/>
  <path d="M37 37 51 51" stroke="url(#vl-handle)" stroke-width="7" stroke-linecap="round"/>
  <path d="m40 40 8 8" stroke="#eaf6ff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Lens -->
  <circle cx="28" cy="28" r="13.5" fill="url(#vl-glass)"/>
  <circle cx="28" cy="28" r="13.5" fill="none" stroke="url(#vl-ring)" stroke-width="3"/>
  <circle cx="28" cy="28" r="11.2" fill="none" stroke="#dff3ff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Reticle -->
  <g stroke="#dff3ff" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round">
    <path d="M28 20.5v4.2M28 31.3v4.2M20.5 28h4.2M31.3 28h4.2"/>
  </g>
  <circle cx="28" cy="28" r="6.5" fill="none" stroke="#7cc4ff" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="28" cy="28" r="3.2" fill="url(#vl-core)"/>
  <circle cx="28" cy="28" r="1.3" fill="#ffffff"/>

  <!-- Glass glint -->
  <path d="M20.8 24.6A8.6 8.6 0 0 1 27 19" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.8" stroke-linecap="round"/>
</svg>
